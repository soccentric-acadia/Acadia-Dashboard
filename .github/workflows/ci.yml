name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-typecheck:
    name: Lint + typecheck (Node)
    runs-on: ubuntu-24.04
    container:
      image: node:22-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: webui/node_modules
          key: npm-${{ hashFiles('webui/package-lock.json') }}
      - name: Install dependencies
        working-directory: webui
        run: npm ci --ignore-scripts
      - name: Lint
        working-directory: webui
        run: npm run lint
      - name: Typecheck
        working-directory: webui
        run: npm run type-check

  build-docker:
    name: Build Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: acadia-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-24.04
    container:
      image: node:22-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: webui/node_modules
          key: npm-${{ hashFiles('webui/package-lock.json') }}
      - name: Install dependencies
        working-directory: webui
        run: npm ci --ignore-scripts
      - name: Run unit tests
        working-directory: webui
        run: npm test -- --run

  contract-tests-server:
    name: Contract tests against real Server API (task 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: dashboard
      # The Dashboard contract tests prove the frontend against the REAL built
      # Server API. Bring in the sibling Server, build+start it, then point the
      # contract tests at it — never a stub.
      - uses: actions/checkout@v4
        with:
          repository: soccentric-acadia/Acadia-Server
          path: server
      - name: Install uv
        run: pipx install uv
      - name: Set up Dashboard contract-test env
        working-directory: dashboard/contract-tests
        run: make setup
      - name: Build + start real Server
        working-directory: server
        run: |
          make build 2>&1 | tail -5
          nohup ./build/native/bin/acadia-server > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health >/dev/null 2>&1 && break; sleep 2; done
      - name: Run Dashboard contract tests against real Server
        working-directory: dashboard/contract-tests
        run: ACADIA_SERVER_URL=http://localhost:8080 make test
      - name: Dump server log on failure
        if: failure()
        run: tail -c 8000 /tmp/server.log
